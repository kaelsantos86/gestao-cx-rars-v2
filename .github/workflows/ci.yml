name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Package validated source
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            package.json
            tsconfig.json
            next.config.ts
            next-env.d.ts
            .gitignore
            src
